<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Eastman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/eastman/assets/notFound-BkYp3z8L.css">
    <link rel="stylesheet" crossorigin href="/eastman/assets/app-Cj0kbSyj.css">

  <body class="not-found-page">
    <main class="not-found-shell">
      <a class="not-found-brand" href="/eastman/" aria-label="Eastman home">
        <img src="/eastman/images/footer_logo.svg" alt="Eastman" />
      </a>

      <section class="not-found-card" aria-labelledby="not-found-title">
        <div class="energy-scene" aria-hidden="true">
          <div class="energy-glow energy-glow--one"></div>
          <div class="energy-glow energy-glow--two"></div>
          <div class="solar-array">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="energy-route">
            <i class="route-dot route-dot--one"></i>
            <i class="route-dot route-dot--two"></i>
            <i class="route-dot route-dot--three"></i>
          </div>
          <div class="battery-unit"><span></span><b></b><b></b><b></b></div>
          <div class="energy-bolt"></div>
        </div>

        <div class="not-found-copy">
          <p class="not-found-kicker"><span></span> Connection interrupted</p>
          <div class="not-found-code" aria-hidden="true"><span>4</span><span class="not-found-zero">0</span><span>4</span></div>
          <h1 id="not-found-title">This page is off the grid.</h1>
          <p>The address may have changed or the page may have moved. Let’s reconnect you with Eastman.</p>
          <div class="not-found-actions">
            <a class="not-found-home" href="/eastman/">Return to homepage <span aria-hidden="true">→</span></a>
            <a class="not-found-contact" href="/eastman/contact-us">Contact us</a>
          </div>
        </div>
      </section>

      <p class="not-found-footnote">Powering progress through energy innovation.</p>
    </main>
